# Runs the live bootstrap on a clean macOS runner and checks each repo left its
# hook. Monthly, to catch upstream drift (brew, casks, iTerm/Homebrew scripts).
name: smoke-macos
on:
  schedule:
    - cron: "0 6 1 * *"   # 06:00 UTC on the 1st
  workflow_dispatch:
  pull_request:
    paths: [setup, .github/workflows/smoke-macos.yml]

jobs:
  smoke:
    runs-on: macos-latest
    timeout-minutes: 60   # 26 casks
    steps:
      - name: Run the live bootstrap
        run: curl -fsSL https://lawrence-berry.github.io/setup | sh
      - name: Check each repo left its hook
        run: |
          fail=0
          check() { if eval "$2"; then echo "ok  $1"; else echo "FAIL $1"; fail=1; fi; }
          check setup-mac     'command -v /opt/homebrew/bin/brew >/dev/null && grep -qs "brew shellenv" ~/.zprofile'
          check setup-iterm   '[ "$(defaults read com.googlecode.iterm2 HotkeyCode)" = 42 ] && cmp -s ~/Projects/util/setup-iterm/karabiner.json ~/.config/karabiner/karabiner.json && grep -q "# setup-iterm$" ~/.zshrc'
          check setup-shell   'grep -q "# setup-shell$" ~/.zshrc'
          check setup-git     'git config --global --get-all include.path | grep -q "setup-git/gitconfig$"'
          check setup-ssh     'grep -q "setup-ssh/config$" ~/.ssh/config'
          check setup-ruby    '[ -L ~/.irbrc ]'
          check setup-secrets '[ -f ~/.secrets/secrets.sh ]'
          exit $fail
